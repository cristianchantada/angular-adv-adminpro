<div class="fondo-modal-imagen fadeIn fast"
  [class.oculto]="modalImagenService.ocultarModal"
>
  <div
    id="responsive-modal"
    class="modal fade show"
    tabindex="-1"
    role="dialog"
    aria-labelledby="myModalLabel"
    style="display: block; padding-right: 17px"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Cargar imagen</h4>
          <button
            type="button"
            class="close"
            (click)="cerrarModal()"
            data-dismiss="modal"
            aria-hidden="true"
          >
            ×
          </button>
        </div>
        <div class="modal-body">
          <h3>Seleccione una imagen</h3>

          <div class="tex-cemter">
            <img *ngIf="!imgTemp" [src]="modalImagenService.img" class="img-avatar"/>
            <img *ngIf="imgTemp" [src]="imgTemp" class="img-avatar"/>
          </div>

          <input
            type="file"
            (change)="cambiarImagen($event.target.files[0])"
          />

        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-default waves-effect"
            data-dismiss="modal"
            (click)="cerrarModal()"
          >
            Cancelar
          </button>
          <button (click)="subirImagen()" type="button" class="btn btn-danger waves-effect waves-light">
            Actualizar foto
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
